name: inbound-triage

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      envelopes:
        description: 'Path to envelopes JSON'
        required: false
        default: 'inbound/envelopes.json'

concurrency:
  group: proof-loop
  cancel-in-progress: false
  # Five proof workflows share this group; the default queue would cancel the
  # earlier pending run whenever a new one is queued.
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Aggregate
        run: |
          mkdir -p inbound
          if [ -f "${{ github.event.inputs.envelopes || 'inbound/envelopes.json' }}" ]; then
            node scripts/inbound-aggregate.mjs --input "${{ github.event.inputs.envelopes || 'inbound/envelopes.json' }}" --out inbound/candidates.json
          else
            echo '{"generatedAt":"","candidates":[]}' > inbound/candidates.json
          fi
      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: inbound-candidates
          path: inbound/candidates.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open triage issue if candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('inbound/candidates.json','utf8'));
            if (c.candidates && c.candidates.length) {
              const body = c.candidates.map(x=>'- '+x.route+' ('+x.installs+' installs, conf '+x.confidence+')').join('\\n');
              fs.writeFileSync('/tmp/issue.md', body);
              console.log('candidates='+c.candidates.length);
            } else console.log('candidates=0');
          "
          if [ -s /tmp/issue.md ]; then gh issue create --title "Inbound candidate routes" --body-file /tmp/issue.md; fi
