name: Heal Proof

on:
  pull_request:
    paths:
      - 'config/generated-rules.json'
      - 'receipts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  heal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Resolve payload version from receipt
        id: payload
        run: |
          V=$(node scripts/payload-version.mjs)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "payloadVersion=$V"

      - name: Resolve AppImage
        id: appimage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --check --json > /tmp/ver.json || node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          fi
          cat /tmp/ver.json

      - name: Download AppImage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --out /tmp/freebuff.AppImage
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --out /tmp/freebuff.AppImage
          fi
          chmod +x /tmp/freebuff.AppImage

      - name: Run E2E with healed artifact
        env:
          FREEBUFF_PAYLOAD_VERSION: ${{ steps.payload.outputs.version }}
        run: node scripts/e2e-headless.mjs --appimage /tmp/freebuff.AppImage --generated-rules config/generated-rules.json --promote --expect-promoted /api/ad/wave31-proof --timeout 240000 --feed
      - name: Publish live receipt + proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p live-proof
          node -e "const fs=require('fs');const crypto=require('crypto');const receipts=fs.readdirSync('receipts').filter(f=>f.startsWith('live-')&&f.endsWith('.json'));const latest=receipts.sort().pop();const r=latest?JSON.parse(fs.readFileSync('receipts/'+latest,'utf8')):{};const html='<!doctype html><html><body><h1>Live proof</h1><pre>'+JSON.stringify(r,null,2)+'</pre></body></html>';fs.writeFileSync('live-proof/index.html',html);"
          git add receipts/live-*.json live-proof/index.html
          git commit -m "chore(proof): publish live receipt" || exit 0
          git push
