name: Heal Proof

on:
  # No `paths` filter: branch protection requires `heal-proof`, and a required
  # check that only runs for some PRs leaves every other PR blocked on a status
  # that never reports. Source PRs must get the real E2E.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: proof-loop
  cancel-in-progress: false
  # Five proof workflows share this group; the default queue would cancel the
  # earlier pending run whenever a new one is queued.
  queue: max

permissions:
  contents: write
  pull-requests: write

jobs:
  heal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Resolve payload version from receipt
        id: payload
        run: |
          V=$(node scripts/payload-version.mjs | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "payloadVersion=$V"

      - name: Resolve AppImage
        id: appimage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --check --json > /tmp/ver.json || node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          fi
          cat /tmp/ver.json

      - name: Download AppImage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --out /tmp/freebuff.AppImage
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --out /tmp/freebuff.AppImage
          fi
          chmod +x /tmp/freebuff.AppImage

      - name: Serve the signed feed locally
        run: |
          node -e "const h=require('http'),f=require('fs'),p=require('path').resolve('feed/manifest.json');h.createServer((q,s)=>{try{s.setHeader('content-type','application/json');s.end(f.readFileSync(p));}catch(e){s.statusCode=404;s.end('no manifest');}}).listen(8765,'127.0.0.1')" &
          ok=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/manifest.json >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then echo "feed server never came up" >&2; exit 1; fi

      - name: Decide promotion assertion
        id: promote
        run: |
          N=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('config/generated-rules.json','utf8'));const n=(Array.isArray(a.addEndpoints)?a.addEndpoints.length:0)+Object.keys(a.addSelectors||{}).length;console.log(n)")
          if [ "$N" -gt 0 ]; then
            echo "flag=--promote" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "artifact carries no healed rules; skipping --promote"
          fi

      - name: Run E2E with healed artifact
        env:
          FREEBUFF_PAYLOAD_VERSION: ${{ steps.payload.outputs.version }}
          FREEBUFF_FEED_URL: http://127.0.0.1:8765/manifest.json
          FREEBUFF_FEED_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAXPPjDp264OD7EOmZY7//cV2rXyP1rNbWnJvHu2I34EI=
            -----END PUBLIC KEY-----
        run: node scripts/e2e-headless.mjs --appimage /tmp/freebuff.AppImage --generated-rules config/generated-rules.json ${{ steps.promote.outputs.flag }} --timeout 240000 --feed

      - name: Require the feed was applied
        run: |
          if [ ! -f /tmp/far-e2e-extract/config/delivery-receipt.json ]; then
            echo "feed delivery receipt missing; --feed did not apply" >&2
            exit 1
          fi
          cat /tmp/far-e2e-extract/config/delivery-receipt.json

      - name: Stage live receipt on a main-based branch
        if: github.event_name != 'pull_request'
        run: |
          V="${{ steps.payload.outputs.version }}"
          if [ ! -f "receipts/live-${V}.json" ]; then
            echo "E2E did not produce receipts/live-${V}.json" >&2
            exit 1
          fi
          mkdir -p /tmp/far-live-receipt
          cp "receipts/live-${V}.json" /tmp/far-live-receipt/
          git fetch origin main
          git checkout -f --detach origin/main
          cp "/tmp/far-live-receipt/live-${V}.json" receipts/

      - name: Publish live receipt
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/live-receipt
          title: "chore(proof): publish live receipt"
          commit-message: "chore(proof): publish live receipt"
          add-paths: receipts/live-*.json
          base: main

