name: Heal Proof

on:
  pull_request:
    paths:
      - 'config/generated-rules.json'
      - 'receipts/**'
      - 'feed/manifest.json'
      - 'live-proof/index.html'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  heal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Resolve payload version from receipt
        id: payload
        run: |
          V=$(node scripts/payload-version.mjs)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "payloadVersion=$V"

      - name: Resolve AppImage
        id: appimage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --check --json > /tmp/ver.json || node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          fi
          cat /tmp/ver.json

      - name: Download AppImage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --out /tmp/freebuff.AppImage
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --out /tmp/freebuff.AppImage
          fi
          chmod +x /tmp/freebuff.AppImage

      - name: Run E2E with healed artifact
        env:
          FREEBUFF_PAYLOAD_VERSION: ${{ steps.payload.outputs.version }}
        run: node scripts/e2e-headless.mjs --appimage /tmp/freebuff.AppImage --generated-rules config/generated-rules.json --promote --timeout 240000 --feed
      - name: Publish live receipt
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/live-receipt
          title: "chore(proof): publish live receipt"
          commit-message: "chore(proof): publish live receipt"
          add-paths: receipts/live-*.json
          base: main

