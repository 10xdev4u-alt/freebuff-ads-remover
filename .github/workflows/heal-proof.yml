name: Heal Proof

on:
  pull_request:
    paths:
      - 'config/generated-rules.json'
      - 'receipts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  heal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Resolve payload version from receipt
        id: payload
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function walk(d) {
              if (!fs.existsSync(d)) return [];
              const out = [];
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const f = path.join(d, e.name);
                if (e.isDirectory()) out.push(...walk(f));
                else if (e.name.endsWith('.json')) out.push(f);
              }
              return out;
            }
            let v = '';
            for (const f of walk('receipts')) {
              try {
                const r = JSON.parse(fs.readFileSync(f, 'utf8'));
                if (r.payloadVersion) { v = r.payloadVersion; break; }
              } catch {}
            }
            if (!v) v = 'latest';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\\n');
            console.log('payloadVersion=' + v);
          "

      - name: Resolve AppImage
        id: appimage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --check --json > /tmp/ver.json || node scripts/fetch-latest-appimage.mjs --check --json > /tmp/ver.json
          fi
          cat /tmp/ver.json

      - name: Download AppImage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --out /tmp/freebuff.AppImage
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --out /tmp/freebuff.AppImage
          fi
          chmod +x /tmp/freebuff.AppImage

      - name: Run E2E with healed artifact
        run: node scripts/e2e-headless.mjs --appimage /tmp/freebuff.AppImage --generated-rules config/generated-rules.json --timeout 240000
