name: proof-publish

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: proof-loop
  cancel-in-progress: false
  # Five proof workflows share this group; the default queue would cancel the
  # earlier pending run whenever a new one is queued.
  queue: max

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Publish newest passing live receipt
        run: node scripts/pick-live-receipt.mjs --receipts receipts --out live-proof/index.html
      - name: Open proof PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/proof-publish
          author: "10xdev4u-alt <10xdev4u@gmail.com>"
          title: "chore(proof): publish live proof page"
          commit-message: "chore(proof): publish live proof page"
          labels: bot-train
          add-paths: live-proof/index.html
