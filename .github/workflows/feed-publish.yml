name: feed-publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'config/generated-rules.json'
      - 'receipts/*.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Build manifest
        run: node scripts/feed-build.mjs --artifact config/generated-rules.json --receipts receipts --out feed/manifest.json --version ${{ github.run_number }}
      - name: Sign manifest
        env:
          FEED_SIGNING_PRIVATE_KEY: ${{ secrets.FEED_SIGNING_PRIVATE_KEY }}
        run: node scripts/feed-sign.mjs --in feed/manifest.json --out feed/manifest.json
      - name: Verify manifest
        env:
          FEED_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAV9Zst2Z+TZ0UjmZgUhacxR2+gaIUyh3JozsNNNb/0CI=
            -----END PUBLIC KEY-----
        run: node -e "const fs=require('fs');const{verifyManifest}=require('./dist/feed.js');const m=JSON.parse(fs.readFileSync('feed/manifest.json','utf8'));const pk=process.env.FEED_PUBLIC_KEY; if(!verifyManifest(m,pk)){console.error('verify failed');process.exit(1);} console.log('verified');"
      - name: Open feed PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/feed-publish
          title: "chore(feed): publish signed manifest"
          commit-message: "chore(feed): publish signed manifest"
          body: "Automated signed feed manifest publish."
