name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.5.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    needs: verify-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keyless cosign signing needs an OIDC token; the verify-artifact job does
    # not sign anything and must not be able to mint one.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assert tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAGV="${{ steps.tag.outputs.version }}"
          if [ "$PKG" != "$TAGV" ]; then
            echo "tag version $TAGV != package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run release:check

      - name: Generate SBOM
        run: |
          CREATED=$(git show -s --format=%cI "${GITHUB_SHA}")
          node scripts/gen-sbom.mjs --out sbom.spdx.json --created "$CREATED"

      - name: Pack release bundle
        run: |
          mkdir -p release
          cp -r dist release/dist
          cp -r scripts release/scripts
          cp -r bin release/bin
          cp -r config release/config
          cp -r corpus release/corpus
          cp -r receipts release/receipts
          cp -r docs release/docs
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json
          cp README.md release/README.md
          cp LICENSE release/LICENSE
          cp CHANGELOG.md release/CHANGELOG.md
          cp sbom.spdx.json release/sbom.spdx.json
          # Deterministic tarball: sorted entries, fixed mtime/owner and a
          # gzip header without a timestamp or filename. Re-pack the same tree
          # at the same commit and the bytes match.
          cd release
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - . \
            | gzip -n > "../freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz"
          cd ..

      - name: Generate checksums
        run: |
          sha256sum freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release tarball
        env:
          COSIGN_YES: 'true'
        run: |
          TARBALL="freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz"
          cosign sign-blob \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.pem" \
            "${TARBALL}"

      - name: Verify release signature
        run: |
          TARBALL="freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz"
          cosign verify-blob \
            --certificate "${TARBALL}.pem" \
            --signature "${TARBALL}.sig" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${{ github.ref }}" \
            "${TARBALL}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz
            freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz.sig
            freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz.pem
            SHA256SUMS
            sbom.spdx.json
          body: |
            ## Install

            ```bash
            tar -xzf freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz
            cd release && npm ci && ./scripts/launch-freebuff.sh
            ```

            Or clone + build:
            ```bash
            git clone https://github.com/10xdev4u-alt/freebuff-ads-remover.git
            cd freebuff-ads-remover && npm install && npm run build
            ./scripts/launch-freebuff.sh
            ```

            Verify the tarball: `sha256sum -c SHA256SUMS`

            Verify the signature (cosign, keyless):

            ```bash
            cosign verify-blob \
              --certificate freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz.pem \
              --signature freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz.sig \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity https://github.com/10xdev4u-alt/freebuff-ads-remover/.github/workflows/release.yml@refs/tags/${{ steps.tag.outputs.tag }} \
              freebuff-ads-remover-${{ steps.tag.outputs.tag }}.tar.gz
            ```

            `sbom.spdx.json` is the SPDX 2.3 bill of materials for the bundle's
            npm dependencies.

  verify-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci && npm run build
      - name: Resolve payload version from receipt
        id: payload
        run: |
          V=$(node scripts/payload-version.mjs | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "payloadVersion=$V"

      - name: Fetch AppImage
        run: |
          if [ "${{ steps.payload.outputs.version }}" = "latest" ]; then
            node scripts/fetch-latest-appimage.mjs --out /tmp/freebuff.AppImage
          else
            node scripts/fetch-latest-appimage.mjs --version ${{ steps.payload.outputs.version }} --out /tmp/freebuff.AppImage
          fi
          chmod +x /tmp/freebuff.AppImage
      - name: Decide promotion assertion
        id: promote
        run: |
          N=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('config/generated-rules.json','utf8'));const n=(Array.isArray(a.addEndpoints)?a.addEndpoints.length:0)+(Array.isArray(a.addHosts)?a.addHosts.length:0)+Object.keys(a.addSelectors||{}).length;console.log(n)")
          if [ "$N" -gt 0 ]; then
            echo "flag=--promote" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "artifact carries no healed rules; skipping --promote"
          fi
      - name: Run headless E2E with healed artifact
        run: node scripts/e2e-headless.mjs --appimage /tmp/freebuff.AppImage --generated-rules config/generated-rules.json ${{ steps.promote.outputs.flag }} --timeout 240000
